name: tests

# 每次推送與 PR 都執行完整後端及前端測試；只使用暫存虛構資料與離線替代服務，不需要任何金鑰。
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: care_console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: care_console/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest -v test_care_console test_case_monitor test_backup_hardening test_monitor_hardening

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: care_console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm test
